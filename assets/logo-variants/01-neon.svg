<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Orbit — neon">
  <defs>
    <radialGradient id="planet" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#e0fbff"/>
      <stop offset="45%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="96" height="96" rx="23" fill="#070b14"/>
  <g filter="url(#glow)">
    <ellipse cx="48" cy="48" rx="37" ry="17" transform="rotate(-38 48 48)" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
    <circle cx="48" cy="48" r="11" fill="url(#planet)"/>
    <circle cx="74" cy="24" r="4.4" fill="#f0abfc" stroke="#070b14" stroke-width="2"/>
  </g>
  <circle cx="22" cy="70" r="1.1" fill="#67e8f9" opacity=".8"/>
  <circle cx="79" cy="66" r="1.4" fill="#a78bfa" opacity=".7"/>
  <circle cx="30" cy="19" r="1" fill="#f472b6" opacity=".7"/>
</svg>
