<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Orbit — retro sunset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1c71"/>
      <stop offset="55%" stop-color="#d76d77"/>
      <stop offset="100%" stop-color="#ffaf7b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="48" cy="52" r="14"/></clipPath>
  </defs>
  <rect width="96" height="96" rx="23" fill="url(#bg)"/>
  <ellipse cx="48" cy="48" rx="38" ry="16" transform="rotate(-40 48 48)" fill="none" stroke="#ffd166" stroke-width="4.6" opacity=".95"/>
  <circle cx="48" cy="52" r="14" fill="url(#sun)"/>
  <g clip-path="url(#planetClip)" fill="#3a1c71" opacity=".55">
    <rect x="30" y="50" width="36" height="2.4"/>
    <rect x="30" y="55" width="36" height="2.8"/>
    <rect x="30" y="60.5" width="36" height="3.2"/>
  </g>
  <circle cx="75" cy="23" r="4.6" fill="#fff3b0"/>
  <circle cx="20" cy="72" r="1.2" fill="#fff3b0" opacity=".85"/>
  <circle cx="80" cy="70" r="1.5" fill="#ffd166" opacity=".8"/>
</svg>
